version: '3.8'

# ====================================================================
# KKK Wheel Care - Multi-Container Deployment Orchestration
# Satisfies Requirement 10: Deployment preparation
# ====================================================================

services:
  # 1. Relational Database Tier (MySQL 8.0)
  mysql-db:
    image: mysql:8.0
    container_name: kkk_mysql_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-KkkSecureRootPass2026!}
      MYSQL_DATABASE: ${DB_NAME:-kkk_wheel_care}
      MYSQL_USER: ${DB_USER:-kkk_app_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-KkkAppSecretPass2026!}
    volumes:
      - kkk_mysql_data:/var/lib/mysql
      # Automatically initialize database schema & initial seed data
      - ../backend/database/schema.sql:/docker-entrypoint-initdb.d/init-schema.sql:ro
    networks:
      - kkk_internal_network
    # Not exposing 3306 to host network for strict security isolation
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 2. Seneca Pattern-Matching Microservice Tier
  seneca-service:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.seneca
    container_name: kkk_seneca_service
    restart: unless-stopped
    environment:
      PORT: 5001
      NODE_ENV: production
    networks:
      - kkk_internal_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 3. Three-Tier Business Logic & REST API Tier (Node.js Express)
  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
    container_name: kkk_backend_api
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: mysql-db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-kkk_app_user}
      DB_PASSWORD: ${DB_PASSWORD:-KkkAppSecretPass2026!}
      DB_NAME: ${DB_NAME:-kkk_wheel_care}
      SENECA_URL: http://seneca-service:5001
      JWT_SECRET: ${JWT_SECRET:-kkk_wheel_care_production_jwt_secret_2026}
    depends_on:
      mysql-db:
        condition: service_healthy
      seneca-service:
        condition: service_started
    ports:
      - "5000:5000"
    networks:
      - kkk_internal_network

  # 4. Presentation Tier (Angular SPA via Nginx Reverse Proxy)
  frontend:
    build:
      context: ../frontend
      dockerfile: ../deployment/Dockerfile.frontend
    container_name: kkk_frontend_app
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - kkk_internal_network

networks:
  kkk_internal_network:
    driver: bridge

volumes:
  kkk_mysql_data:
    name: kkk_wheel_care_mysql_volume
