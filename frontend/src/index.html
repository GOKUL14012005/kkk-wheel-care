<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>KKK Wheel Care | Precision Automotive & Clean Energy Solutions</title>
  <base href="/">
  
  <!-- Responsive Mobile Viewport & PWA Optimization -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d90429">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KKK Care">
  
  <!-- Favicon and PWA Web Manifest -->
  <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg">
  <link rel="apple-touch-icon" href="/icons/icon-192.svg">
  <link rel="manifest" href="/manifest.webmanifest">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
  
  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Service Worker Registration & Cache Management -->
  <script>
    if ('serviceWorker' in navigator) {
      // Purge any stale v1 cache immediately from window context
      if ('caches' in window) {
        caches.keys().then(function(cacheNames) {
          cacheNames.forEach(function(cacheName) {
            if (cacheName !== 'kkk-wheel-care-v2') {
              console.log('[Cache Cleanup] Deleting stale cache:', cacheName);
              caches.delete(cacheName);
            }
          });
        });
      }

      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js')
          .then(function(registration) {
            registration.update();
            console.log('[PWA] Service Worker registered and updated:', registration.scope);
          })
          .catch(function(error) {
            console.warn('[PWA] Service Worker registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
